name: Build and upload timeout-fix APK

on:
  push:
    paths:
      - '.github/workflows/build-upload-timeout-apk.yml'

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 442633ee79fb2747f34ec31fc2f4ea7d2e1c7c04
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/app-release.apk
      - name: Retarget tag and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2.2.2 442633ee79fb2747f34ec31fc2f4ea7d2e1c7c04
          git push origin -f refs/tags/v2.2.2
          gh release edit v2.2.2 --repo "$GITHUB_REPOSITORY" --target 442633ee79fb2747f34ec31fc2f4ea7d2e1c7c04
          gh release upload v2.2.2 /tmp/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
